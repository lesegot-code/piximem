version: '3.8'

services:
  backend:
    build: ./backend
    container_name: piximem-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads-data:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: piximem-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads-data: